<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kerala Chat Room</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0c0d12; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* Login Page */
    #login-page {
      position: fixed; inset: 0; background: #0c0d12; z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .login-box {
      background: #15171e; border: 1px solid #2a2d3d; border-radius: 20px; padding: 30px 20px;
      width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .login-box h2 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 6px; }
    .login-box p { font-size: 0.85rem; color: #9ca3af; margin-bottom: 24px; line-height: 1.4; }
    .login-input {
      width: 100%; padding: 12px 16px; background: #0e0f14; border: 1px solid #2a2d3d;
      border-radius: 10px; color: #fff; font-size: 1rem; margin-bottom: 14px; outline: none;
    }
    .btn-main {
      width: 100%; padding: 12px; background: #558b2f; color: #fff; border: none;
      border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-guest {
      width: 100%; padding: 12px; background: #1e2230; color: #fff; border: 1px solid #2a2d3d;
      border-radius: 10px; font-weight: bold; font-size: 0.95rem; cursor: pointer;
    }

    /* Main Chat UI */
    #chat-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
    
    /* Nav */
    header {
      height: 55px; background: #15171e; border-bottom: 1px solid #2a2d3d;
      display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0;
    }
    .nav-title { font-size: 1rem; font-weight: bold; color: #38bdf8; cursor: pointer; }
    .nav-dp { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #00a8e8; object-fit: cover; cursor: pointer; }

    /* Chat Messages */
    #main-chat { flex: 1; overflow-y: auto; padding: 12px 14px; list-style: none; }
    #messages { display: flex; flex-direction: column; gap: 10px; }
    #messages li {
      display: flex; gap: 10px; align-items: flex-start;
      position: relative; transition: transform 0.15s ease-out; touch-action: pan-y;
    }
    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; cursor: pointer; }
    .msg-body { background: #15171e; border: 1px solid #242735; padding: 8px 12px; border-radius: 14px; max-width: 82%; }
    .msg-meta-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
    .sender-name { font-size: 0.8rem; font-weight: bold; color: #e2e8f0; cursor: pointer; }
    .msg-time { font-size: 0.7rem; color: #9ca3af; }
    .msg-content { font-size: 0.9rem; color: #fff; word-break: break-word; }

    /* Reply preview inside bubble */
    .quoted-reply { background: #0c0d12; border-left: 3px solid #38bdf8; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: #9ca3af; margin-bottom: 6px; }

    /* Reply Preview Bar */
    #reply-preview-bar {
      display: none; background: #1e2230; border-left: 4px solid #00a8e8; padding: 6px 14px;
      align-items: center; justify-content: space-between; font-size: 0.85rem; color: #fff;
    }

    /* Secret Room Typing Bar */
    #typing-indicator-bar { display: none; padding: 4px 14px; font-size: 0.8rem; color: #38bdf8; background: #12141a; font-style: italic; }

    /* Bottom Input Bar */
    #bottom-input-bar {
      background: #15171e; border-top: 1px solid #2a2d3d; padding: 8px 12px;
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    #input {
      flex: 1; background: #0e0f14; border: 1px solid #2a2d3d; border-radius: 20px;
      padding: 10px 16px; color: #fff; font-size: 0.92rem; outline: none;
    }
    .btn-send { background: none; border: none; color: #00a8e8; font-size: 1.3rem; cursor: pointer; padding: 4px; }

    /* Simplified Profile Modal */
    #account-profile-modal {
      display: none; position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: #15171e; border: 1px solid #2a2d3d; width: 100%; max-width: 320px;
      border-radius: 20px; padding: 22px; text-align: center; color: #fff; position: relative;
    }

    /* Room Select Modal */
    #room-modal {
      display: none; position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.8);
      align-items: center; justify-content: center; padding: 16px;
    }
  </style>
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="login-page">
    <div class="login-box">
      <h2>കേരള Chat Room</h2>
      <p>Welcome! Enter your username to continue to the chat community.</p>
      <input type="text" id="username-input" class="login-input" placeholder="Enter Username..." />
      <button class="btn-main" onclick="startAppLogin()">✈ Login</button>
      <button class="btn-guest" onclick="startGuestLogin()">Guest login</button>
    </div>
  </div>

  <!-- CHAT CONTAINER -->
  <div id="chat-container">
    <header>
      <div class="nav-title" onclick="openRoomPicker()">🏠 <span id="nav-room-name">Kerala Chat Room</span> ▼</div>
      <img id="nav-user-dp" class="nav-dp" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" onclick="openProfileModal()" />
    </header>

    <div id="main-chat">
      <ul id="messages"></ul>
    </div>

    <div id="typing-indicator-bar">✍️ <span id="typing-user-name"></span> is typing...</div>

    <div id="reply-preview-bar">
      <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:85%;">
        <span style="color:#38bdf8; font-weight:bold;">↩️ Replying to <span id="reply-to-user"></span>:</span>
        <span id="reply-to-text" style="color:#9ca3af; margin-left:4px;"></span>
      </div>
      <span onclick="cancelReply()" style="cursor:pointer; color:#ef4444; font-weight:bold; font-size:1.1rem;">✕</span>
    </div>

    <form id="bottom-input-bar" onsubmit="return sendMessage(event)">
      <input type="text" id="input" placeholder="Type here..." autocomplete="off" oninput="handleTypingInput()" />
      <button type="submit" class="btn-send">✈</button>
    </form>
  </div>

  <!-- PROFILE MODAL -->
  <div id="account-profile-modal">
    <div class="modal-box">
      <span style="position:absolute; right:16px; top:14px; font-size:1.25rem; cursor:pointer; color:#9ca3af;" onclick="closeProfileModal()">✕</span>
      <h3 style="margin-bottom:16px; font-size:1.1rem; color:#e5e7eb;">My Profile</h3>

      <div style="position:relative; width:92px; height:92px; margin:0 auto 12px auto;">
        <img id="prof-modal-dp" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" style="width:100%; height:100%; border-radius:50%; object-fit:cover; border:2px solid #00a8e8;">
        <button onclick="document.getElementById('avatar-file-input').click()" style="position:absolute; bottom:0; right:0; background:#00a8e8; border:none; border-radius:50%; width:30px; height:30px; color:#fff; cursor:pointer;">📷</button>
      </div>

      <h4 id="prof-modal-username" style="margin-bottom:4px; font-size:1.2rem;">Username</h4>
      <div id="prof-modal-role" style="font-size:0.8rem; color:#38bdf8; font-weight:bold; margin-bottom:16px;">Member</div>

      <div style="background:#0e0f14; border-radius:10px; padding:12px; text-align:left; font-size:0.85rem; margin-bottom:16px; border:1px solid #242735;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span style="color:#9ca3af;">🏠 Room:</span> <strong id="prof-info-room">Kerala Chat Room</strong></div>
        <div style="display:flex; justify-content:space-between;"><span style="color:#9ca3af;">🌐 Country:</span> <strong>India 🇮🇳</strong></div>
      </div>

      <button onclick="document.getElementById('avatar-file-input').click()" style="width:100%; background:#2563eb; color:#fff; border:none; padding:10px; border-radius:10px; font-weight:bold; cursor:pointer; margin-bottom:8px;">📷 ഗ്യാലറിയിൽ നിന്ന് DP മാറ്റുക</button>
      <button onclick="logoutApp()" style="width:100%; background:#dc2626; color:#fff; border:none; padding:10px; border-radius:10px; font-weight:bold; cursor:pointer;">🚪 Logout</button>
    </div>
  </div>

  <!-- ROOM PICKER MODAL -->
  <div id="room-modal">
    <div class="modal-box">
      <span style="position:absolute; right:16px; top:14px; font-size:1.25rem; cursor:pointer; color:#9ca3af;" onclick="closeRoomPicker()">✕</span>
      <h3 style="margin-bottom:16px; font-size:1.1rem; color:#e5e7eb;">Choose Room</h3>
      <button onclick="selectRoom('Kerala Chat Room')" style="width:100%; background:#1e2230; color:#fff; border:1px solid #2a2d3d; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer; margin-bottom:10px;">🏠 Kerala Chat Room</button>
      <button onclick="selectRoom('hanu ameen secret room 💗')" style="width:100%; background:#3b1e2e; color:#ff77a9; border:1px solid #ff77a9; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">🔒 hanu ameen secret room 💗</button>
    </div>
  </div>

  <!-- Hidden Photo Picker -->
  <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="uploadNewProfilePic(this)">

  <script>
    const socket = io();
    let myName = localStorage.getItem('kcr_name') || '';
    let myRole = localStorage.getItem('kcr_role') || 'Member';
    let myAvatar = localStorage.getItem('kcr_avatar') || '';
    let currentRoom = 'Kerala Chat Room';
    let activeReply = null;
    let typingTimeout = null;
    const SECRET_ROOM_PASS = 'a26h31';

    // ആപ്പ് ലോഡ് ചെയ്യുമ്പോൾ ലോഗിൻ പരിശോധിക്കുന്നു
    window.addEventListener('DOMContentLoaded', () => {
      if (myName) {
        initChat();
      } else {
        document.getElementById('login-page').style.display = 'flex';
      }
    });

    function startAppLogin() {
      const inp = document.getElementById('username-input');
      const val = inp.value.trim();
      if (!val) return alert("Username നൽകുക!");
      executeLogin(val);
    }

    function startGuestLogin() {
      const guestName = "Guest_" + Math.floor(1000 + Math.random() * 9000);
      executeLogin(guestName);
    }

    function executeLogin(username) {
      myName = username;
      myRole = (username.toLowerCase() === 'ameen') ? 'Owner' : 'Member';
      
      const savedDp = localStorage.getItem('kcr_saved_dp_' + myName);
      myAvatar = savedDp || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(myName)}`;

      localStorage.setItem('kcr_name', myName);
      localStorage.setItem('kcr_role', myRole);
      localStorage.setItem('kcr_avatar', myAvatar);

      initChat();
    }

    function initChat() {
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('nav-user-dp').src = myAvatar;
      document.getElementById('prof-modal-dp').src = myAvatar;
      document.getElementById('prof-modal-username').textContent = myName;
      document.getElementById('prof-modal-role').textContent = myRole;

      socket.emit('join', {
        name: myName,
        avatar: myAvatar,
        room: currentRoom,
        isVip: (myRole === 'Owner'),
        clientRole: myRole
      });
    }

    // മെസ്സേജ് അയക്കൽ
    function sendMessage(e) {
      if (e) e.preventDefault();
      const inp = document.getElementById('input');
      const text = inp.value.trim();
      if (!text) return false;

      const payload = { type: 'text', content: text };
      if (activeReply) {
        payload.replyTo = activeReply;
        cancelReply();
      }

      if (currentRoom === 'hanu ameen secret room 💗') {
        socket.emit('typing', { user: myName, isTyping: false });
      }

      socket.emit('chat message', payload);
      inp.value = '';
      return false;
    }

    // മെസ്സേജ് റെൻഡറിംഗ് & സ്വൈപ്പ് അറ്റാച്ച്
    socket.on('chat message', (data) => {
      renderMessage(data);
    });

    socket.on('load room messages', (list) => {
      const msgList = document.getElementById('messages');
      msgList.innerHTML = '';
      if (Array.isArray(list)) {
        list.forEach(m => renderMessage(m));
      }
    });

    function renderMessage(data) {
      if (!data) return;
      if (data.id && document.getElementById(data.id)) return;

      const li = document.createElement('li');
      if (data.id) li.id = data.id;

      let quoteHtml = '';
      if (data.replyTo) {
        quoteHtml = `<div class="quoted-reply">💬 <strong>${data.replyTo.user}:</strong> ${data.replyTo.text}</div>`;
      }

      const isOwnerOrVip = (myRole === 'Owner');
      const delBtn = `<span style="cursor:pointer; font-size:0.75rem; opacity:0.6; margin-left:6px;" onclick="promptDeleteMessage('${data.id}')" title="Delete">🗑️</span>`;

      li.innerHTML = `
        <img class="msg-avatar" src="${data.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=user'}" onclick="openUserProfileModal('${data.user}', '${data.role}', false)">
        <div class="msg-body">
          <div class="msg-meta-row">
            <span class="sender-name" onclick="openUserProfileModal('${data.user}', '${data.role}', false)">★ ${data.user}</span>
            <div>
              <span class="msg-time">${data.time || ''}</span>
              ${delBtn}
            </div>
          </div>
          ${quoteHtml}
          <div class="msg-content">${data.content}</div>
        </div>
      `;

      // ഇടത്തോട്ട് സ്വൈപ്പ് ചെയ്യുമ്പോൾ മെൻഷൻ ചെയ്യുന്ന ടച്ച് ഇവന്റ്
      attachSwipeToReply(li, data.user, data.content);

      document.getElementById('messages').appendChild(li);
      const chatArea = document.getElementById('main-chat');
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Swipe-to-Mention ടച്ച് ഇവന്റ്
    function attachSwipeToReply(liElement, sender, text) {
      let startX = 0;
      let diffX = 0;
      let swiping = false;

      liElement.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        swiping = true;
      }, { passive: true });

      liElement.addEventListener('touchmove', (e) => {
        if (!swiping) return;
        diffX = e.touches[0].clientX - startX;
        if (diffX < 0 && diffX > -70) {
          liElement.style.transform = `translateX(${diffX}px)`;
        }
      }, { passive: true });

      liElement.addEventListener('touchend', () => {
        if (!swiping) return;
        swiping = false;
        if (diffX < -30) {
          replyToMessage(sender, text);
          if (navigator.vibrate) { try { navigator.vibrate(30); } catch(err){} }
        }
        liElement.style.transform = "translateX(0px)";
        startX = 0; diffX = 0;
      });
    }

    function replyToMessage(user, text) {
      activeReply = { user, text };
      document.getElementById('reply-to-user').textContent = user;
      document.getElementById('reply-to-text').textContent = (text.length > 35) ? text.substring(0, 35) + '...' : text;
      document.getElementById('reply-preview-bar').style.display = 'flex';
      const inp = document.getElementById('input');
      inp.focus();
      inp.placeholder = `Replying to ${user}...`;
    }

    function cancelReply() {
      activeReply = null;
      document.getElementById('reply-preview-bar').style.display = 'none';
      const inp = document.getElementById('input');
      inp.placeholder = "Type here...";
    }

    // ടൈപ്പിംഗ് ഇൻഡിക്കേറ്റർ
    function handleTypingInput() {
      if (currentRoom === 'hanu ameen secret room 💗') {
        socket.emit('typing', { user: myName, isTyping: true });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          socket.emit('typing', { user: myName, isTyping: false });
        }, 1500);
      }
    }

    socket.on('user typing', (data) => {
      const bar = document.getElementById('typing-indicator-bar');
      const nameEl = document.getElementById('typing-user-name');
      if (data.isTyping && currentRoom === 'hanu ameen secret room 💗') {
        nameEl.textContent = data.user;
        bar.style.display = 'block';
      } else {
        bar.style.display = 'none';
      }
    });

    // മെസ്സേജ് ഡിലീറ്റ്
    function promptDeleteMessage(msgId) {
      if (myRole !== 'Owner') {
        return alert("⛔ മെസ്സേജ് ഡിലീറ്റ് ചെയ്യാനുള്ള സൗകര്യം Owner-ക്ക് മാത്രമുള്ളതാണ്!");
      }
      if (confirm("ഈ മെസ്സേജ് എല്ലാവർക്കും കാണാത്ത രീതിയിൽ ഡിലീറ്റ് ചെയ്യണമെന്നുറപ്പാണോ?")) {
        socket.emit('delete chat message', msgId);
      }
    }

    socket.on('message deleted', (msgId) => {
      const el = document.getElementById(msgId);
      if (el) el.remove();
    });

    // ഗാലറിയിൽ നിന്ന് DP അപ്‌ലോഡ് (ഓട്ടോ കംപ്രഷൻ)
    function uploadNewProfilePic(el) {
      const file = el.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_SIZE = 300;
          let width = img.width, height = img.height;
          if (width > height) {
            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
          } else {
            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
          }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          myAvatar = canvas.toDataURL("image/jpeg", 0.85);
          localStorage.setItem("kcr_avatar", myAvatar);
          localStorage.setItem("kcr_saved_dp_" + myName, myAvatar);

          document.getElementById('nav-user-dp').src = myAvatar;
          document.getElementById('prof-modal-dp').src = myAvatar;

          socket.emit("join", { name: myName, avatar: myAvatar, room: currentRoom, isVip: (myRole === 'Owner'), clientRole: myRole });
          alert("✅ പ്രൊഫൈൽ ഫോട്ടോ അപ്‌ഡേറ്റ് ആയി!");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      el.value = "";
    }

    // മോഡലുകൾ
    function openProfileModal() {
      document.getElementById('prof-info-room').textContent = currentRoom;
      document.getElementById('account-profile-modal').style.display = 'flex';
    }
    function closeProfileModal() {
      document.getElementById('account-profile-modal').style.display = 'none';
    }
    function openUserProfileModal(user, role, isSelf) {
      document.getElementById('prof-modal-username').textContent = user;
      document.getElementById('prof-modal-role').textContent = role || 'Member';
      document.getElementById('prof-info-room').textContent = currentRoom;
      document.getElementById('prof-modal-dp').src = (user === myName) ? myAvatar : `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(user)}`;
      document.getElementById('account-profile-modal').style.display = 'flex';
    }

    function openRoomPicker() { document.getElementById('room-modal').style.display = 'flex'; }
    function closeRoomPicker() { document.getElementById('room-modal').style.display = 'none'; }

    function selectRoom(roomName) {
      if (roomName === 'hanu ameen secret room 💗') {
        const pass = prompt("Enter Secret Room Password:");
        if (pass !== SECRET_ROOM_PASS) {
          return alert("❌ തെറ്റായ പാസ്‌വേഡ്!");
        }
      }
      currentRoom = roomName;
      document.getElementById('nav-room-name').textContent = roomName;
      closeRoomPicker();
      socket.emit('switch room', currentRoom);
    }

    function logoutApp() {
      localStorage.removeItem('kcr_name');
      localStorage.removeItem('kcr_role');
      localStorage.removeItem('kcr_avatar');
      window.location.reload();
    }
  </script>
</body>
</html>
